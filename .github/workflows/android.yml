name: Build Krishna Travels APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android project
        shell: bash
        run: |
          PROJECT_DIR=""

          detect_project() {
            local dir="$1"
            if [ -f "$dir/gradlew" ] || [ -f "$dir/settings.gradle" ] || [ -f "$dir/settings.gradle.kts" ] || [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              return 0
            fi
            return 1
          }

          if detect_project "."; then
            :
          else
            for candidate in ./*; do
              if [ -d "$candidate" ] && { [ -f "$candidate/gradlew" ] || [ -f "$candidate/settings.gradle" ] || [ -f "$candidate/settings.gradle.kts" ] || [ -f "$candidate/build.gradle" ] || [ -f "$candidate/build.gradle.kts" ]; }; then
                PROJECT_DIR="$candidate"
                break
              fi
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            unzip_dir="/tmp/krishna-travels-project"
            rm -rf "$unzip_dir"
            mkdir -p "$unzip_dir"

            shopt -s nullglob
            zip_files=(./*.zip)
            shopt -u nullglob

            if [ "${#zip_files[@]}" -gt 0 ]; then
              for zip_file in "${zip_files[@]}"; do
                unzip -q "$zip_file" -d "$unzip_dir"
              done

              for candidate in "$unzip_dir"/*; do
                if [ -d "$candidate" ] && { [ -f "$candidate/gradlew" ] || [ -f "$candidate/settings.gradle" ] || [ -f "$candidate/settings.gradle.kts" ] || [ -f "$candidate/build.gradle" ] || [ -f "$candidate/build.gradle.kts" ]; }; then
                  PROJECT_DIR="$candidate"
                  break
                fi
              done
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Android project or Gradle wrapper found in the repository." >&2
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR="${PROJECT_DIR:-.}"
          chmod +x "$PROJECT_DIR/gradlew"
          "$PROJECT_DIR/gradlew" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: krishna-travels-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
