name: Build Krishna Travels APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android project
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f ./project/gradlew ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            echo "No Android project or Gradle wrapper found in the repository." >&2
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR="${PROJECT_DIR:-.}"
          chmod +x "$PROJECT_DIR/gradlew"
          "$PROJECT_DIR/gradlew" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: krishna-travels-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
